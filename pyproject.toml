[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-emi-guardian"
version = "0.0.2"
description = "KiCad 10+ IPC plugin for EMI screening, JLCPCB DFM validation, and conservative PCB cleanup"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryo Nishikawa and EMI Guardian contributors" }]
dependencies = ["kicad-python>=0.7.1,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage[toml]>=7,<8"]
docs = ["sphinx>=8", "myst-parser>=4", "markdown-it-py>=3"]
quality = ["ruff>=0.16,<1", "mypy>=1.18,<3", "bandit[toml]>=1.9,<2", "yamllint>=1.37,<2", "build>=1.3,<2", "pip-audit>=2.9,<3"]

[tool.setuptools]
package-dir = { "" = "plugin" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["plugin"]
include = ["emi_guardian*"]

[tool.setuptools.package-data]
emi_guardian = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["plugin"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["plugin/emi_guardian"]

[tool.coverage.report]
precision = 1
skip_covered = true

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["plugin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
